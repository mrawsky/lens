
name: lens

services:
  lens:
    build:
      context: ../..
      dockerfile: deploy/runtime/Dockerfile
    image: lens:local

    environment:
      LENS_MODE: standalone
      LENS_ADMIN_TOKEN: ${SERVICE_PASSWORD_64_LENSADMIN}
      LENS_PUBLIC_URL: ${SERVICE_URL_LENS_4318}

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_LENSCH}
      CLICKHOUSE_DATABASE: lens

      AGENT_TRACING_RETENTION_DAYS: "14"

      # LiteLLM integration
      LITELLM_LENS_SERVICE_TOKEN: ${SERVICE_PASSWORD_64_LENSSERVICE}
      LENS_GATEWAY_SECRET: ${SERVICE_PASSWORD_64_LENSGATEWAY}

    expose:
      - "4318"

    depends_on:
      clickhouse:
        condition: service_healthy

    networks:
      - default
      - storage

    restart: unless-stopped
    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.6.6@sha256:eb4870e7ca7ed70c259eebfcfbee6cf797017f6b5436c2926bbbfe3d4d28486e

    environment:
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_LENSCH}
      CLICKHOUSE_DB: lens
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../clickhouse/keeper.xml:/etc/clickhouse-server/config.d/lens-keeper.xml:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --host clickhouse --user lens --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 30

    restart: unless-stopped

    networks:
      - storage

networks:
  storage:
    internal: true

volumes:
  clickhouse_data:
