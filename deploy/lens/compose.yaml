name: lens

services:
  lens:
    build:
      context: .
      dockerfile: deploy/runtime/Dockerfile
      args:
        LENS_VERSION: ${LENS_VERSION:-0.1.0-dev.0}
    image: ${LENS_IMAGE:-lens:local}

    environment:
      LENS_MODE: standalone
      LENS_ADMIN_TOKEN: ${SERVICE_PASSWORD_64_LENSADMIN:-}
      LENS_PUBLIC_URL: ${SERVICE_URL_LENS:-}

      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_LENSCH:-}
      CLICKHOUSE_DATABASE: lens

      AGENT_TRACING_RETENTION_DAYS: ${AGENT_TRACING_RETENTION_DAYS:-14}

    expose:
      - "4318"

    depends_on:
      clickhouse:
        condition: service_healthy

    networks:
      - default
      - storage

    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${LENS_TMP_SIZE:-1g}

    mem_limit: 2g
    cpus: 2
    pids_limit: 128

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:4318/health/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  clickhouse:
    build:
      context: deploy/clickhouse
      dockerfile: Dockerfile

    environment:
      CLICKHOUSE_USER: lens
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_LENSCH:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --host 127.0.0.1 --user lens --password "$$CLICKHOUSE_PASSWORD"
          --query "SELECT 1 FROM system.zookeeper WHERE path = '/' LIMIT 1" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    restart: unless-stopped
    stop_grace_period: 60s

    networks:
      - storage

networks:
  storage:
    internal: true

volumes:
  clickhouse_data:
